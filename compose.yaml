name: hw5_online_cinema

services:
  kafka:
    image: confluentinc/cp-kafka:7.9.11
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "JL_eEMF1Sk-aUnW5DGzHFQ"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
  schema-registry:
    container_name: schema-registry
    image: confluentinc/cp-schema-registry:7.9.11
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
  kafka-init:
    image: confluentinc/cp-kafka:7.9.11
    entrypoint: ["kafka-topics"]
    command:
      - "--bootstrap-server"
      - "kafka:29092"
      - "--create"
      - "--if-not-exists"
      - "--topic"
      - "movie-events"
      - "--partitions"
      - "3"
      - "--replication-factor"
      - "1"
    depends_on:
      kafka:
        condition: service_healthy
  schema-init:
    image: python:3.12-alpine
    volumes:
      - ./schemas/movie_event.avsc:/schemas/movie_event.avsc:ro
      - ./infrastructure/schema/register_schema.py:/app/register_schema.py:ro
    command: ["python", "/app/register_schema.py"]
    environment:
      SCHEMA_PATH: /schemas/movie_event.avsc
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    depends_on:
      schema-registry:
        condition: service_healthy
    restart:
      "no"
  movie-service:
    build: ./movie-service
    ports:
      - "5000:5000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SCHEMA_PATH: /schemas/movie_event.avsc
    volumes:
      - ./schemas/movie_event.avsc:/schemas/movie_event.avsc:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-init:
        condition: service_completed_successfully
  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      CLICKHOUSE_DB: cinema
      CLICKHOUSE_USER: cinema
      CLICKHOUSE_PASSWORD: cinema_dev_password 
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/sql:/docker-entrypoint-initdb.d:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          clickhouse-client
          --host clickhouse
          --user "$$CLICKHOUSE_USER"
          --password "$$CLICKHOUSE_PASSWORD"
          --database "$$CLICKHOUSE_DB"
          --query "SELECT 1"
          >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: cinema_analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U analytics -d cinema_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  aggregation-service:
    build: ./aggregation-service
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: cinema
      CLICKHOUSE_PASSWORD: cinema_dev_password

      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: cinema_analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics_dev_password

      AGGREGATION_INTERVAL_MINUTES: ${AGGREGATION_INTERVAL_MINUTES:-1440}
    ports: 
      - "5001:5001"
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  kafka-data:
  clickhouse-data:
  postgres-data:

